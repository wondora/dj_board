services:
  web:
    build: .
    container_name: django_web
    user: "1000:1000"
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn dj_board.wsgi:application \
      --bind unix:/run/shared/gunicorn.sock \
      --workers 3 --threads 2 --timeout 60 \
      --worker-class gthread --preload \
      --max-requests 1000 --max-requests-jitter 50
      "
    volumes:
      - static_volume:/static
      - socket_volume:/run/shared
      # ▼ [수정됨] 호스트의 ./media를 컨테이너 내부의 /app/media와 연결합니다.
      - ./media:/app/media
    networks:
      - dj_board_default     
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: django_nginx
    volumes:
      - static_volume:/static:ro
      # ▼ [수정됨] Nginx는 보통 관습적으로 /media 경로를 많이 씁니다.
      # (nginx.conf 설정에서 alias /media/; 라고 되어 있다고 가정)
      - ./media:/media:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - socket_volume:/run/shared
      - /tmp:/host_tmp
    depends_on:
      - web
    expose:
      - "80"
    networks:
      - dj_board_default      
    restart: always

volumes:
  static_volume:
  socket_volume:

networks:
  dj_board_default:
    external: true
