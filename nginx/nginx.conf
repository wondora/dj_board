# ==========================================================
# 1. 전역 공통 설정 (게시판 & 메모 사이트 공유)
# ==========================================================
client_max_body_size 200M;

# Gzip 최적화
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6; 
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types 
    text/plain 
    text/css 
    application/json 
    application/javascript 
    text/xml 
    application/xml 
    application/xml+rss 
    text/javascript;

# TCP 및 성능 최적화
tcp_nopush on;
tcp_nodelay on;
#keepalive_timeout 65;

# 공통 프록시 설정 (변수로 관리)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_read_timeout 60s;
proxy_buffers 8 16k;
proxy_buffer_size 32k;

# ==========================================================
# 2. 게시판 서비스 (ccw.fji.kr)
# ==========================================================
server {
    listen 80;
    server_name ccw.fji.kr; # 실제 도메인으로 수정

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        gzip_static on; 
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://unix:/run/shared/gunicorn.sock;
    }
}

# ==========================================================
# 3. 메모 사이트 서비스 (memos.fji.kr)
# ==========================================================
server {
    listen 80;
    server_name memos.fji.kr; # 실제 도메인으로 수정

    location / {
        # 호스트의 /tmp와 연결된 컨테이너 내부 경로 확인 필수
        proxy_pass http://unix:/host_tmp/node_memo.sock;
    }
}
